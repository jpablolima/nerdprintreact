apiVersion: apps/v1
kind: Deployment
metadata:
  name: nerdprint
  namespace: nerdprint
  labels:
    app: nerdprint
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nerdprint
  template:
    metadata:
      labels:
        app: nerdprint

    spec:
      containers:
        - name: nerdprint
          image: nerdprint
          imagePullPolicy: Never
          ports:
            - containerPort: 80

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "256m"
              memory: "256Mi"
