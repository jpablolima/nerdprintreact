apiVersion: apps/v1
kind: Deployment
metadata:
  name: nerdprint
  namespace: nerdprint
  labels:
    app: nerdprint

spec:
  replicas: 1

  selector:
    matchLabels:
      app: nerdprint

  template:
    metadata:
      labels:
        app: nerdprint

    spec:
      containers:

        # ==========================================
        # NERDPRINT / NGINX
        # ==========================================
        - name: nerdprint
          image: nerdprint
          imagePullPolicy: Never

          ports:
            - name: http
              containerPort: 80
              protocol: TCP

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "256m"
              memory: "256Mi"

          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true

        # ==========================================
        # NGINX PROMETHEUS EXPORTER
        # ==========================================
        - name: nginx-exporter
          image: nginx/nginx-prometheus-exporter:1.5
          imagePullPolicy: IfNotPresent

          args:
            - "--nginx.scrape-uri=http://127.0.0.1:80/stub_status"

          ports:
            - name: metrics
              containerPort: 9113
              protocol: TCP

          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "50m"
              memory: "32Mi"

      # ==========================================
      # VOLUME DO NGINX
      # ==========================================
      volumes:
        - name: nginx-config
          configMap:
            name: nerdprint-nginx-config
