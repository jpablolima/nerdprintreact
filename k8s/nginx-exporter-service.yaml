apiVersion: v1
kind: Service
metadata:
  name: nerdprint-nginx-exporter
  namespace: nerdprint
  labels:
    app: nerdprint
    component: nginx-exporter

spec:
  selector:
    app: nerdprint

  ports:
  - name: metrics
    port: 9113
    targetPort: metrics
    protocol: TCP

  type: ClusterIP
