apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hpa-nerd-print
  namespace: nerdprint
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nerdprint
  minReplicas: 1
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
